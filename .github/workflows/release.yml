name: Build and Release

on:
  push:
    tags: ["v*"]      # e.g. push the tag v1.0.0 to publish a release
  workflow_dispatch:   # or run it by hand from the Actions tab

permissions:
  contents: write

# Each system is built on its own machine and checked with the app's self-test (it opens a PDF,
# edits it, searches, saves - and takes a screenshot, kept with the run). Then one last job
# puts every file that was made into the release: Windows' installer, the macOS disk images,
# the Linux AppImage. (One job, so they don't race each other to make the release.)
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Put the version into the app
        # the app compares its own version with the newest release to offer updates:
        # APP_VERSION = "dev" becomes e.g. APP_VERSION = "1.2.0" (from the tag v1.2.0)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $code = Get-Content master_pdf.py -Raw -Encoding utf8
          $code = $code -replace '(?m)^APP_VERSION = "dev"', "APP_VERSION = `"$version`""
          Set-Content master_pdf.py $code -NoNewline -Encoding utf8
          Select-String -Path master_pdf.py -Pattern '^APP_VERSION = '
      - name: Build the exe
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name MasterPDF --icon icon.ico --add-data "icon.ico;." --add-data "icon.png;." --collect-all tkinterdnd2 --collect-all pymupdf master_pdf.py
      - name: Self-test
        timeout-minutes: 5
        run: |
          $env:MASTERPDF_SELFTEST = "1"
          $env:MASTERPDF_SELFTEST_OUT = "$PWD\selftest.txt"
          $env:MASTERPDF_SELFTEST_SHOT = "$PWD\screenshot-windows.png"
          Start-Process dist\MasterPDF.exe -Wait
          $result = @(Get-Content selftest.txt)  # (@(): a list even for one line)
          $result
          if ($result[0].Trim() -ne "ok") { exit 1 }
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build the installer
        # the version comes from the tag: v1.0.0 -> "1.0.0" (a run started by hand, with no
        # tag, keeps the default in installer.iss)
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart("v")
            & $iscc "/DMyAppVersion=$version" installer.iss
          } else {
            & $iscc installer.iss
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Keep the installer and screenshot with the run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MasterPDF-Windows
          path: |
            installer_output/MasterPDF-Windows-Setup.exe
            screenshot-windows.png
          if-no-files-found: ignore

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14          # Apple chips (M1 and newer)
            file: MasterPDF-Mac-AppleChip-M1-and-newer
          - runner: macos-15-intel    # Intel Macs
            file: MasterPDF-Mac-Intel-chip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Put the version into the app
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed -i '' "s/^APP_VERSION = \"dev\"/APP_VERSION = \"$version\"/" master_pdf.py
          grep '^APP_VERSION = ' master_pdf.py
      - name: Build the app and its disk image
        run: bash packaging/build_mac.sh "${{ matrix.file }}"
      - name: Self-test
        timeout-minutes: 5
        run: |
          MASTERPDF_SELFTEST=1 MASTERPDF_SELFTEST_OUT="$PWD/selftest.txt" \
          MASTERPDF_SELFTEST_SHOT="$PWD/screenshot-${{ matrix.file }}.png" \
          "dist/Master PDF.app/Contents/MacOS/Master PDF" || true
          cat selftest.txt
          test "$(head -n 1 selftest.txt)" = "ok"
      - name: Keep the disk image and screenshot with the run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.file }}
          path: |
            installer_output/${{ matrix.file }}.dmg
            screenshot-${{ matrix.file }}.png
          if-no-files-found: ignore

  linux:
    runs-on: ubuntu-22.04   # (an older Linux: the AppImage then runs on older and newer systems)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Tk and a screen to test on
        run: sudo apt-get update && sudo apt-get install -y tk8.6 libtk8.6 xvfb
      - name: Put the version into the app
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed -i "s/^APP_VERSION = \"dev\"/APP_VERSION = \"$version\"/" master_pdf.py
          grep '^APP_VERSION = ' master_pdf.py
      - name: Build the AppImage
        run: bash packaging/build_linux.sh
      - name: Self-test
        timeout-minutes: 5
        run: |
          MASTERPDF_SELFTEST=1 MASTERPDF_SELFTEST_OUT="$PWD/selftest.txt" \
          MASTERPDF_SELFTEST_SHOT="$PWD/screenshot-linux.png" APPIMAGE_EXTRACT_AND_RUN=1 \
          xvfb-run -a -s "-screen 0 1600x1000x24" installer_output/MasterPDF-Linux.AppImage || true
          cat selftest.txt
          test "$(head -n 1 selftest.txt)" = "ok"
      - name: Keep the AppImage and screenshot with the run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MasterPDF-Linux
          path: |
            installer_output/MasterPDF-Linux.AppImage
            screenshot-linux.png
          if-no-files-found: ignore

  release:
    needs: [windows, macos, linux]
    if: always() && startsWith(github.ref, 'refs/tags/')   # (what was made goes out)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: What's going in
        run: ls -laR files
      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          files: |
            files/**/MasterPDF-Windows-Setup.exe
            files/**/*.dmg
            files/**/*.AppImage
