name: Build and Release

on:
  push:
    tags: ["v*"]      # e.g. push the tag v2.0.0 to publish a release
  workflow_dispatch:   # or run it by hand from the Actions tab (builds and checks, no release)

permissions:
  contents: write

# Each system is built on its own machine and checked with the app's self-test (it opens a PDF, reads its page with
# the text reader, finds its fonts - and takes a screenshot, kept with the run). Then one last job puts every file
# that was made into the release: Windows' installer, the macOS disk images, the Linux AppImage - the same names as
# the Python version's, so its in-app updates find this version too.
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-svg
            mingw-w64-ucrt-x86_64-tesseract-ocr
            mingw-w64-ucrt-x86_64-leptonica
            mingw-w64-ucrt-x86_64-potrace
            mingw-w64-ucrt-x86_64-harfbuzz
            mingw-w64-ucrt-x86_64-freetype
            mingw-w64-ucrt-x86_64-jbig2dec
            mingw-w64-ucrt-x86_64-openjpeg2
            mingw-w64-ucrt-x86_64-libjpeg-turbo
            mingw-w64-ucrt-x86_64-gumbo-parser
      - name: The compiler and libraries at the versions the app is made with (GCC 15.2, Qt 6.9.1, Tesseract 5.5.1, MuPDF 1.24.3...)
        # (the newest ones read scans differently - the installed app's scans weren't run.bat's: these are packaging/
        # windows-packages.txt's, all at once)
        run: |
          urls=$(tr -d '\r' < packaging/windows-packages.txt | grep -v '^#' | sed 's|^|https://repo.msys2.org/mingw/ucrt64/mingw-w64-ucrt-x86_64-|; s|$|-any.pkg.tar.zst|')
          pacman -U --noconfirm --overwrite '*' $urls
          pacman -Q mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-qt6-base mingw-w64-ucrt-x86_64-tesseract-ocr mingw-w64-ucrt-x86_64-leptonica mingw-w64-ucrt-x86_64-libmupdf
      - name: Build the app
        # the version comes from the tag: v2.0.0 -> "2.0.0" (it compares it with the newest release to offer updates);
        # a run started by hand, with no tag, is "dev"
        run: |
          version=dev
          if [ "${{ github.ref_type }}" = tag ]; then version="${GITHUB_REF_NAME#v}"; fi
          bash packaging/build_windows.sh "$version"
      - name: Self-test
        timeout-minutes: 5
        shell: pwsh   # (not MSYS2's shell: its libraries mustn't be found - only the ones beside the app)
        run: |
          $env:MASTERPDF_SELFTEST_OUT = "$PWD\selftest.txt"
          $p = Start-Process dist\MasterPDF.exe -ArgumentList '--self-test','packaging\selftest.pdf','screenshot-windows.png' -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart("v")
            & $iscc "/DMyAppVersion=$version" installer.iss
          } else {
            & $iscc installer.iss
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Keep the installer and screenshot with the run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MasterPDF-Windows
          path: |
            installer_output/MasterPDF-Windows-Setup.exe
            screenshot-windows.png
          if-no-files-found: ignore

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14          # Apple chips (M1 and newer)
            file: MasterPDF-Mac-AppleChip-M1-and-newer
          - runner: macos-15-intel    # Intel Macs
            file: MasterPDF-Mac-Intel-chip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.9.1"
          cache: true
      - name: Install the libraries
        run: brew install ninja pkgconf tesseract leptonica potrace harfbuzz freetype jbig2dec openjpeg jpeg-turbo gumbo-parser
      - name: MuPDF (kept between runs)
        id: mupdf
        uses: actions/cache@v4
        with:
          path: build-deps/mupdf
          key: mupdf-1.24.3-${{ matrix.runner }}-v1
      - name: Build MuPDF 1.24.3
        if: steps.mupdf.outputs.cache-hit != 'true'
        run: bash packaging/build_mupdf.sh build-deps/mupdf
      - name: Build the app and its disk image
        run: |
          version=dev
          if [ "${{ github.ref_type }}" = tag ]; then version="${GITHUB_REF_NAME#v}"; fi
          bash packaging/build_mac.sh "${{ matrix.file }}" "$version" "$PWD/build-deps/mupdf"
      - name: Self-test
        timeout-minutes: 5
        run: |
          MASTERPDF_SELFTEST_OUT="$PWD/selftest.txt" \
          "build-mac/dmg/Master PDF.app/Contents/MacOS/MasterPDF" --self-test packaging/selftest.pdf \
            "$PWD/screenshot-${{ matrix.file }}.png" || true
          cat selftest.txt
          test "$(head -n 1 selftest.txt)" = "ok"
      - name: Keep the disk image and screenshot with the run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.file }}
          path: |
            installer_output/${{ matrix.file }}.dmg
            screenshot-${{ matrix.file }}.png
          if-no-files-found: ignore

  linux:
    runs-on: ubuntu-22.04   # (an older Linux: the AppImage then runs on older and newer systems)
    steps:
      - uses: actions/checkout@v4
      - name: Install the libraries and a screen to test on
        # (Tesseract 5 from its maintainer's PPA: Ubuntu 22.04's own is 4)
        run: |
          sudo add-apt-repository -y ppa:alex-p/tesseract-ocr5
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libfontconfig1-dev libdbus-1-3 \
            libfreetype-dev libharfbuzz-dev libjbig2dec0-dev libopenjp2-7-dev libjpeg-dev zlib1g-dev libgumbo-dev \
            libtesseract-dev libleptonica-dev libpotrace-dev libfuse2 xvfb
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.9.1"
          cache: true
      - name: MuPDF (kept between runs)
        id: mupdf
        uses: actions/cache@v4
        with:
          path: build-deps/mupdf
          key: mupdf-1.24.3-ubuntu-22.04-v1
      - name: Build MuPDF 1.24.3
        if: steps.mupdf.outputs.cache-hit != 'true'
        run: bash packaging/build_mupdf.sh build-deps/mupdf
      - name: Build the AppImage
        run: |
          version=dev
          if [ "${{ github.ref_type }}" = tag ]; then version="${GITHUB_REF_NAME#v}"; fi
          QMAKE="$QT_ROOT_DIR/bin/qmake" bash packaging/build_linux.sh "$version" "$PWD/build-deps/mupdf"
      - name: Self-test
        timeout-minutes: 5
        run: |
          MASTERPDF_SELFTEST_OUT="$PWD/selftest.txt" APPIMAGE_EXTRACT_AND_RUN=1 \
          xvfb-run -a -s "-screen 0 1600x1000x24" installer_output/MasterPDF-Linux.AppImage \
            --self-test packaging/selftest.pdf "$PWD/screenshot-linux.png" || true
          cat selftest.txt
          test "$(head -n 1 selftest.txt)" = "ok"
      - name: Keep the AppImage and screenshot with the run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MasterPDF-Linux
          path: |
            installer_output/MasterPDF-Linux.AppImage
            screenshot-linux.png
          if-no-files-found: ignore

  release:
    needs: [windows, macos, linux]
    if: always() && startsWith(github.ref, 'refs/tags/')   # (what was made goes out)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: What's going in
        run: ls -laR files
      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          files: |
            files/**/MasterPDF-Windows-Setup.exe
            files/**/*.dmg
            files/**/*.AppImage
